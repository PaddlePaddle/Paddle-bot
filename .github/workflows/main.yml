name: Print Environment Variables

on:
  push:
    branches:
      - test-patch-1  

jobs:
  print-env:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Print AK and SK
      env:
        AK: ${{ secrets.AK }} 
        SK: ${{ secrets.SK }}  
      run: |
        echo "AK: $AK"
        echo "SK: $SK"
